image: maven:3.9.6-eclipse-temurin-21

stages:
  - build
  - test
  - quality
  - package
  - publish
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  IMAGE_NAME: "marketplace/catalogue-service"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"

cache:
  paths:
    - .m2/repository
    - .sonar/cache

# ===== BUILD =====
build-job:
  stage: build
  script:
    - mvn clean compile -B

# ===== UNIT TESTS =====
unit-test-job:
  stage: test
  script:
    - mvn test -B

# ===== SONARCLOUD =====
sonarcloud-check:
  stage: quality
  script:
    - mvn verify sonar:sonar -B -DskipTests -DskipITs
  only:
    - main
    - merge_requests

# ===== PACKAGE: build the JAR =====
package-jar:
  stage: package
  script:
    - mvn clean package -DskipTests -DskipITs -B -pl catalogue-service
  artifacts:
    paths:
      - catalogue-service/target/*.jar
    expire_in: 1 hour
  only:
    - main

# ===== PUBLISH: build Docker image + push to ECR =====
publish-image:
  stage: publish
  image: ubuntu:24.04
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  before_script:
    - apt-get update -qq
    - apt-get install -qq -y curl unzip ca-certificates gnupg
    # AWS CLI v2
    - curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
    - unzip -q awscliv2.zip
    - ./aws/install
    - aws --version
    # Docker CLI + buildx
    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    - chmod a+r /etc/apt/keyrings/docker.gpg
    - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update -qq
    - apt-get install -qq -y docker-ce-cli docker-buildx-plugin
    - docker --version
  script:
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
    - docker buildx create --use --name builder || true
    - docker buildx build --platform linux/amd64
      -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
      -t $ECR_REGISTRY/$IMAGE_NAME:latest
      -f catalogue-service/Dockerfile
      --push .
  dependencies:
    - package-jar
  only:
    - main

# ===== DEPLOY TO EKS =====
deploy-eks:
  stage: deploy
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -qq -y curl unzip ca-certificates
    - curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
    - unzip -q awscliv2.zip
    - ./aws/install
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - aws eks update-kubeconfig --region $AWS_REGION --name yanashop-eks
  script:
    - kubectl set image deployment/catalogue-service catalogue-service=$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG -n yanashop
    - kubectl rollout status deployment/catalogue-service -n yanashop --timeout=5m
  only:
    - main
  when: manual
image: maven:3.9.6-eclipse-temurin-21

stages:
  - .pre
  - build
  - test
  - quality
  - package
  - publish
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  IMAGE_NAME: "marketplace/catalogue-service"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  CI_TOOLS_IMAGE: "$CI_REGISTRY_IMAGE/ci-tools:v1.0"

cache:
  paths:
    - .m2/repository
    - .sonar/cache

# ===== PREPARE: Build the CI tools image used by later stages =====
build-ci-tools:
  stage: .pre
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      if ! docker pull $CI_TOOLS_IMAGE; then
        echo "Image $CI_TOOLS_IMAGE not found, building..."
        docker build -t $CI_TOOLS_IMAGE -f Dockerfile.ci .
        docker push $CI_TOOLS_IMAGE
      else
        echo "Image $CI_TOOLS_IMAGE already exists."
      fi
  rules:
    - changes:
        - Dockerfile.ci
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ===== BUILD =====
build-job:
  stage: build
  script:
    - mvn clean compile -B

# ===== UNIT TESTS =====
unit-test-job:
  stage: test
  script:
    - mvn test -B

# ===== SONARCLOUD =====
sonarcloud-check:
  stage: quality
  script:
    - mvn verify sonar:sonar -B -DskipTests -DskipITs
  only:
    - main
    - merge_requests

# ===== PACKAGE: build the JAR =====
package-jar:
  stage: package
  script:
    - mvn clean package -DskipTests -DskipITs -B -pl catalogue-service
  artifacts:
    paths:
      - catalogue-service/target/*.jar
    expire_in: 1 hour
  only:
    - main

# ===== PUBLISH: build Docker image + push to ECR =====
publish-image:
  stage: publish
  image: $CI_TOOLS_IMAGE
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  before_script:
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - docker buildx create --use --name builder || true
    - docker buildx build --platform linux/amd64
      -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
      -t $ECR_REGISTRY/$IMAGE_NAME:latest
      -f catalogue-service/Dockerfile
      --push .
  dependencies:
    - package-jar
  only:
    - main

# ===== DEPLOY TO EKS =====
deploy-eks:
  stage: deploy
  image: $CI_TOOLS_IMAGE
  before_script:
    - aws eks update-kubeconfig --region $AWS_REGION --name yanashop-eks
  script:
    - kubectl set image deployment/catalogue-service catalogue-service=$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG -n yanashop
    - kubectl rollout status deployment/catalogue-service -n yanashop --timeout=5m
  only:
    - main
  when: manual
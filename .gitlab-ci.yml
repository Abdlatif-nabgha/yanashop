image: maven:3.9.6-eclipse-temurin-21

stages:
  - build
  - test
  - integration-test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository

# ===== BUILD =====
build-job:
  stage: build
  script:
    - echo "Compiling..."
    - mvn clean compile -B

# ===== UNIT TESTS (no Docker needed) =====
unit-test-job:
  stage: test
  script:
    - echo "Running unit tests..."
    - mvn test -B

